name: test
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22] # the README promises Node 20 or newer
    steps:
      # pinned to commits (a tag can be moved to other code); the comment says which release that is
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false # the job never pushes: don't leave the token in .git/config
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
      # Electron is only needed to run the app, and the tests don't import it.
      - run: npm ci --ignore-scripts
      - run: npm test
