name: test
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Electron is only needed to run the app, and the tests don't import it.
      - run: npm ci --ignore-scripts
      - run: npm test
